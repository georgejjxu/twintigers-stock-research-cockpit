name: build
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        working-directory: java
        run: mvn -B verify
      - name: Docker image builds
        run: docker build -t twintigers/research:ci java
