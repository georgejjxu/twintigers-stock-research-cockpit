# Rule thresholds for the Java research engine. Every value below is the built-in default; uncomment and edit
# a line to change it. The server reads this file at start (restart Claude Code / reconnect the MCP server after
# editing). Definitions of each rule: docs/architecture/rule-catalog.md. Tune with the replay_rules tool.

# --- Fundamental rules (financial_health) -------------------------------------------------------------------
# F03: margin fell more than this many points
#fundamental.operatingMarginDropPts=3.0
# F05: operating cash flow / net income below this (not for banks)
#fundamental.cashConversionMin=0.8
# F06: diluted shares grew more than this %
#fundamental.dilutionMaxPct=2.0
# F07: debt up more than this % while cash fell
#fundamental.debtRisePct=20.0
# F08/F09: free cash flow fell more than this % (year / year-to-date)
#fundamental.fcfDropPct=30.0
# F10: free cash flow fell this many years in a row...
#fundamental.fcfDeclineYears=2
# ...each by at least this %
#fundamental.fcfDeclineMinPct=5.0
# F11: net debt rose more than this % in a year
#fundamental.netDebtRisePct=10.0
# SEC industry codes treated as banks/lenders (F05 not applied)
#fundamental.bankSicMin=6000
#fundamental.bankSicMax=6199

# --- Price rules (price_signals, replay_rules, portfolio_review) ----------------------------------------------
#price.atrPeriod=14
# average volume measured over the 20 days before the signal day
#price.volumePeriod=20
# PA01/PA02: day's true range >= this x ATR
#price.jumpAtrMultiple=1.5
# PA01: close in top 25% of range; PA02: bottom 25%
#price.controlCloseLocation=0.25
# PA01/PA02: volume >= this x average
#price.controlRelVolume=1.5
# PA03/PA04: gap of at least this %
#price.gapMinPct=0.5
#price.gapRelVolume=1.2
# PA05: lower closes in a row / days below a falling 20-day average
#price.declineDays=5
# PA05: volume over those days >= this x the prior average
#price.declineVolumeRise=1.2
# PA06/PA07: swing high/low = extreme of 5 days each side
#price.pivotHalfWindow=5
#price.levelLookback=120
#price.levelClusterAtr=0.5
#price.levelMinTouches=2
#price.breakBufferAtr=0.25
# PA06/PA07: previous 5 closes on the other side of the level
#price.levelConfirmDays=5
# candlestick trend context: close vs 5 days earlier and vs SMA20
#price.trendLookback=5
#price.longBodyAtr=0.6
#price.shadowBodyRatio=2.0
#price.smallShadowRange=0.15
#price.minRangeAtr=0.5
#price.starBodyRatio=0.3
#price.rsiPeriod=14
#price.rsiOverbought=70
#price.rsiOversold=30
#price.macdFast=12
#price.macdSlow=26
#price.macdSignal=9



# --- X-ray (Cockpit X-ray page): limits each check compares against. Uncomment to change, then restart the Cockpit.
# xray.maxSinglePct=10          largest single company, % of net worth
# xray.maxAccountPct=50         largest account, % of the invested amount
# xray.minBaseCurrencyPct=50    invested in the base currency (CAD), at least %
# xray.maxCurrencyPct=50        any one foreign currency, % of the invested amount
# xray.maxSectorPct=35          any one sector, % of the invested amount
# xray.maxRegionPct=80          any one region, % of the invested amount
# xray.maxFeePct=1              fees paid, % of everything bought
# xray.emergencyFund=0          cash to keep aside, CAD (0 = not set up)

# --- Markets page benchmarks (Yahoo symbols): SYMBOL=Name;SYMBOL=Name. Blank = the built-in list.
# market.benchmarks=^GSPTSE=S&P/TSX Composite;^GSPC=S&P 500;USDCAD=X=US dollar in CAD

